name: Test Pi orchestration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Dependency-free engine tests
        run: npm test
      - name: Install reference Pi 1.4.0 SDK and compiler (no lifecycle scripts)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-test" --ignore-scripts --no-audit --no-fund \
            @earendil-works/pi-coding-agent@1.4.0 \
            @earendil-works/pi-agent-core@1.4.0 \
            @earendil-works/pi-ai@1.4.0 typescript@5.9.3 @types/node@22
          echo "PI_SDK_ROOT=$RUNNER_TEMP/pi-test/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
          ln -s "$RUNNER_TEMP/pi-test/node_modules" node_modules
      - name: Actual Pi package, loader and core tests (simulated provider)
        run: npm run test:pi
      - name: Optional Planning with Files integration tests
        run: npm run test:planning
      - name: Strict optional planning extension type checking
        shell: bash
        run: |
          "$RUNNER_TEMP/pi-test/node_modules/.bin/tsc" --noEmit --allowImportingTsExtensions \
            --module nodenext --moduleResolution nodenext --target es2022 \
            --skipLibCheck --strict --types node \
            integrations/planning-with-files/upstream/extensions/planning-with-files/index.ts
      - name: Strict extension type checking
        shell: bash
        run: |
          "$RUNNER_TEMP/pi-test/node_modules/.bin/tsc" --noEmit --allowJs --checkJs false \
            --module nodenext --moduleResolution nodenext --target es2022 \
            --skipLibCheck --strict --types node extensions/ops-orchestrator/index.ts extensions/ponytail/index.ts
