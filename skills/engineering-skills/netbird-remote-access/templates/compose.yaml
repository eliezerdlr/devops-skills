# Modelo documental: rever capacidades por versão e obter aprovação antes de usar.
name: ${NB_PROJECT_NAME:?Definir projecto exclusivo}

services:
  netbird-router:
    image: ${NB_IMAGE:?Definir imagem oficial por versao e digest verificados}
    container_name: ${NB_HOSTNAME:?Definir nome exclusivo}
    hostname: ${NB_HOSTNAME:?Definir nome exclusivo}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NB_MANAGEMENT_URL: ${NB_MANAGEMENT_URL:?Definir endpoint aprovado}
      NB_HOSTNAME: ${NB_HOSTNAME:?Definir nome exclusivo}
      NB_CONFIG: /var/lib/netbird/config.json
      NB_DISABLE_PROFILES: "true"
      NB_DISABLE_DNS: "true"
      NB_LOG_FILE: console
      NB_ENTRYPOINT_SERVICE_TIMEOUT: "60"
    volumes:
      - type: bind
        source: ${NB_STATE_DIR:?Definir directoria de estado aprovada}
        target: /var/lib/netbird
        bind:
          create_host_path: false
    # Valores ilustrativos; dimensionar e aprovar para o destino.
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/netbird", "status", "--check", "startup"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
